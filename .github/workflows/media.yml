name: media
on:
  push:
    branches: [media]
    paths: ['media/src.tsv', '.github/workflows/media.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save --silent ffmpeg-static@5 && echo "$PWD/node_modules/ffmpeg-static" >> $GITHUB_PATH
      - name: fetch and compress
        env:
          BASE: https://d8j0ntlcm91z4.cloudfront.net/user_3LvXW9MOuZrwO6YjV6Tj7iCTolv
        run: |
          mkdir -p media/p media/v tmp
          while IFS=$'\t' read -r id f; do
            [ -z "$id" ] && continue
            case "$f" in
              *.png|*.jpg|*.jpeg|*.webp)
                [ -f "media/p/$id.webp" ] && continue
                curl -fsSL -m 120 -o "tmp/$id.src" "$BASE/$f" || { echo "FAIL $id"; continue; }
                ffmpeg -nostdin -loglevel error -y -i "tmp/$id.src" -vf "scale=1200:1200:flags=lanczos" -c:v libwebp -quality 90 -compression_level 6 "media/p/$id.webp"
                ffmpeg -nostdin -loglevel error -y -i "tmp/$id.src" -vf "scale=420:420:flags=lanczos" -c:v libwebp -quality 84 "media/p/$id.s.webp"
                ;;
              *.mp4)
                [ -f "media/v/$id.mp4" ] && continue
                curl -fsSL -m 120 -o "tmp/$id.mp4" "$BASE/$f" || { echo "FAIL $id"; continue; }
                ffmpeg -nostdin -loglevel error -y -i "tmp/$id.mp4" -an -vf "scale=720:-2:flags=lanczos" -c:v libx264 -preset slow -crf 21 -pix_fmt yuv420p -movflags +faststart "media/v/$id.mp4"
                                ffmpeg -nostdin -loglevel error -y -i "tmp/$id.mp4" -frames:v 1 -c:v libwebp -quality 88 "media/v/$id.webp"
                ;;
            esac
          done < media/src.tsv
          ls -la media/p media/v
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          git diff --cached --quiet || git commit -q -m "media: сжатые фото и видео меню"
          git push
