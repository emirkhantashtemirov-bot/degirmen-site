// Superhero для Android: Trusted Web Activity - открывает degirmen-navoi.kz/fit/ на весь экран через Chrome
plugins { id 'com.android.application' }
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
android {
    namespace 'kz.degirmen.superhero.app'
    compileSdk 35
    defaultConfig {
        applicationId 'kz.degirmen.superhero.app'
        minSdk 23
        targetSdk 35
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'none.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'superhero'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
