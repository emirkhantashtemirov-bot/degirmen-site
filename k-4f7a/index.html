<head>

<meta name="robots" content="noindex, nofollow">
<title>Дерево Degirmen Navoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout idea: a glowing tree fills the screen; one card at the bottom talks (tour or details), four big buttons sit under it. */
:root{
  --bg:#03060c;
  --ink:#e4f6ff;
  --dim:#8fb0c2;
  --cy:#38e1ff;
  --gold:#ffb43a;
  --line:rgba(56,225,255,.32);
  --panel:rgba(6,15,26,.92);
  --display:"Exo 2","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-text-size-adjust:100%}
body{background:radial-gradient(ellipse at 50% 70%,#0a1a30 0%,#03060c 72%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,#0b1c34 0%,#03060c 75%)}
.gcard{width:100%;max-width:440px;border:1px solid var(--line);background:var(--panel);padding:24px 22px 20px;position:relative}
.gcard::before{content:"";position:absolute;left:-1px;top:-1px;width:16px;height:16px;border-left:3px solid var(--gold);border-top:3px solid var(--gold)}
.k{font:600 11px/1 var(--mono);letter-spacing:.26em;color:var(--cy);text-transform:uppercase}
.gcard h1{margin:12px 0 6px;font-size:25px;line-height:1.2;font-weight:700;text-wrap:balance}
.gcard p{margin:0 0 16px;color:var(--dim);font-size:15px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:54px;padding:10px 14px;border:1px solid var(--line);background:rgba(56,225,255,.05);font-size:17px;border-radius:2px}
.opt b{font:600 14px var(--mono);color:var(--gold);min-width:16px}
.opt:hover,.opt:active{background:rgba(56,225,255,.16);border-color:var(--cy)}
.opt.bad{border-color:#ff6b6b;background:rgba(255,107,107,.12);animation:shake .35s}
.opt.good{border-color:#46e6a0;background:rgba(70,230,160,.16)}
#gmsg{min-height:22px;margin:12px 0 0;font-size:14px;color:#ffb0b0}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* app */
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;pointer-events:none;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
#top .k{font-size:10.5px}
#top h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.card{position:absolute;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);max-height:50%;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-left:2px solid var(--gold);border-top:2px solid var(--gold);pointer-events:none}
.cbody{overflow-y:auto;padding:14px 16px 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.cbody h3{margin:4px 0 6px;font-size:21px;line-height:1.2;font-weight:700;text-wrap:balance}
.cbody p{margin:0 0 10px;font-size:16px;line-height:1.45;color:#cfe6f2}
.step{font:600 11px/1 var(--mono);letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
.num{border:1px solid var(--line);padding:8px 10px;background:rgba(56,225,255,.05)}
.num b{display:block;font:600 26px/1.1 var(--mono);color:var(--cy);font-variant-numeric:tabular-nums}
.num span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
ul.plain{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:7px}
ul.plain li{position:relative;padding-left:20px;font-size:15.5px;line-height:1.4;color:#d6eaf5}
ul.plain li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.nav{display:flex;gap:8px;padding:8px 12px 12px;align-items:center}
.nav .sp{flex:1}
.btn{min-height:48px;padding:0 18px;border:1px solid var(--line);background:rgba(56,225,255,.08);font-weight:600;font-size:16px;border-radius:2px}
.btn:hover,.btn:active{background:rgba(56,225,255,.22);border-color:var(--cy)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1b1203}
.btn.pri:hover{background:#ffc25e}
.link{background:none;border:0;color:var(--dim);font-size:14px;padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
.dots{display:flex;gap:5px;margin:0 6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(56,225,255,.25)}
.dots i.on{background:var(--gold)}
.chart{display:flex;align-items:flex-end;gap:2px;height:96px;margin:8px 0 4px;padding-bottom:0;border-bottom:1px solid var(--line)}
.chart i{flex:1;min-width:0;background:linear-gradient(to top,var(--cy),#7be9ff);opacity:.95;position:relative}
.chart i.z{background:rgba(56,225,255,.18);height:2px!important}
.axis{display:flex;justify-content:space-between;font:400 11.5px var(--mono);color:var(--dim)}
.sig{margin:10px 0 4px;font-size:15px;color:var(--gold);letter-spacing:.02em}

/* sheet (details) */
.eyebrow{font:600 10.5px/1 var(--mono);letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin:12px 0 8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--dim)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c)}
.name{font-size:22px;font-weight:700;margin:6px 0 2px;line-height:1.2;word-break:break-word}
.code{font:400 13px var(--mono);color:var(--cy);margin:0 0 8px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{min-height:38px;padding:0 11px;border:1px solid var(--line);background:rgba(56,225,255,.06);font-size:14px;border-radius:2px}
.links button.tc{font:400 12.5px var(--mono);color:var(--dim)}
.links button:active,.links button:hover{background:rgba(56,225,255,.22);border-color:var(--cy)}
.x{position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--dim);line-height:1}

/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(3,6,12,.96) 60%,rgba(3,6,12,0))}
#bar button{min-height:48px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14.5px;border-radius:2px;padding:0 4px}
#bar button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#bar button:active{background:rgba(56,225,255,.22)}

/* modal lists */
.modal{position:absolute;inset:0;z-index:20;background:rgba(3,6,12,.86);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px 12px}
.modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.modal h3{margin:0;font-size:20px;flex:1}
.modal .list{overflow-y:auto;display:grid;gap:8px;align-content:start;padding-bottom:12px}
.row{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--cy));background:rgba(56,225,255,.05);border-radius:2px}
.row:active,.row:hover{background:rgba(56,225,255,.18)}
.row strong{display:block;font-size:16.5px}
.row em{display:block;font-style:normal;font-size:13.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.row small{display:block;font:400 12px var(--mono);color:var(--cy);margin-top:4px}
#q{width:100%;min-height:48px;border:1px solid var(--line);background:var(--panel);padding:0 14px;font-size:17px;border-radius:2px}
#q::placeholder{color:#5f8396}

@media (min-width:900px){
  .card{left:auto;right:16px;width:460px;bottom:78px;max-height:70%}
  #bar{left:auto;right:16px;width:460px;padding-left:0;padding-right:0}
  #top h2{font-size:24px}
  .cbody h3{font-size:23px}
}
@media (prefers-reduced-motion:reduce){.opt.bad{animation:none}}
</style>
</head>

  if(sel>=0&&!(l.i===sel||adj[sel].indexOf(l.i)>=0))a*=.35;
  return a;
}

/* ---------- drawing ---------- */
function strokeCurve(pts,frac,w,col,alpha){
  const n=Math.max(2,Math.floor(pts.length*frac));if(frac<=0)return;
  ctx.beginPath();let p=w2s(pts[0][0],pts[0][1]);ctx.moveTo(p[0],p[1]);
  for(let i=1;i<n;i++){p=w2s(pts[i][0],pts[i][1]);ctx.lineTo(p[0],p[1]);}
  if(frac<1&&n<pts.length){}
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=col;ctx.globalAlpha=alpha*.28;ctx.lineWidth=w*cam.z*2.6+3;ctx.stroke();
  ctx.globalAlpha=alpha;ctx.lineWidth=Math.max(1.2,w*cam.z);ctx.stroke();
}
const labelsPlaced=[];
function label(txt,x,y,col,size,weight,center,force){
  ctx.font=(weight||600)+' '+size+'px "Exo 2",sans-serif';const w=ctx.measureText(txt).width;
  const lx=center?x-w/2:x;
  if(!force){for(const p of labelsPlaced){if(lx<p[0]+p[2]+4&&lx+w+4>p[0]&&Math.abs(y-p[1])<size+2)return false;}}
  labelsPlaced.push([lx,y,w]);
  ctx.lineWidth=4;ctx.strokeStyle='rgba(3,6,12,.92)';ctx.lineJoin='round';ctx.strokeText(txt,lx,y);ctx.fillStyle=col;ctx.fillText(txt,lx,y);return true;
}
const LA=[[0,-650,1],[572,-300,1],[-330,-250,2],[345,-385,0],[-260,-345,2],[150,-445,0],[-180,-432,2],[150,-548,0],[-120,-485,2],[150,-497,0]];
function lblPos(bi){const a=LA[bi],p=w2s(a[0],a[1]);return {x:p[0],y:p[1],al:a[2]};}
let tnow=0;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  labelsPlaced.length=0;
  /* ground glow */
  let g0=w2s(0,6);const gr=ctx.createRadialGradient(g0[0],g0[1],0,g0[0],g0[1],240*cam.z);
  gr.addColorStop(0,'rgba(56,225,255,.16)');gr.addColorStop(1,'rgba(56,225,255,0)');
  ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.save();ctx.translate(g0[0],g0[1]);ctx.scale(1,.28);ctx.translate(-g0[0],-g0[1]);ctx.beginPath();ctx.arc(g0[0],g0[1],240*cam.z,0,7);ctx.fill();ctx.restore();
  ctx.globalCompositeOperation='lighter';
  /* trunk */
  const tf=clamp(grow/.12,0,1);
  strokeCurve(trunkCurve,hlBranches&&!hlBranches.has(0)?tf:tf,22,'#9fe9ff',hlBranches&&!hlBranches.has(0)?.3:.85);
  /* branches */
  T.branches.forEach((b,bi)=>{
    const col=BR[bi].c;let dim=1;if(hlBranches&&!hlBranches.has(bi))dim=.18;if(focusBr>=0&&bi!==focusBr)dim=Math.min(dim,.25);
    const f=clamp((grow-b.t0)/(b.t1-b.t0),0,1);
    if(b.curve)strokeCurve(b.curve,f,9,col,.8*dim);
    b.twigs.forEach(t=>{
      const tf2=clamp((grow-t.g0+.1)/.14,0,1);
      strokeCurve(t.curve,tf2,Math.max(2.2,5-t.dl/260),col,.6*dim);
    });
  });
  /* leaves */
  const sh=[];
  for(const l of L){
    if(!leafShown(l))continue;
    const a=leafAlpha(l);if(a<=.01)continue;
    const p=w2s(l.x,l.y);
    if(p[0]<-30||p[0]>W+30||p[1]<-30||p[1]>H+30)continue;
    let r=Math.max(l.r*cam.z,2.4);
    if(!(showAll||topVis.has(l.i)))r=Math.max(r*.8,3.2);
    const px=r*4.4;
    ctx.globalAlpha=Math.min(1,.88*a);ctx.drawImage(spr[l.b],p[0]-px/2,p[1]-px/2,px,px);
    sh.push([l,p,r]);
  }
  /* links of selected leaf */
  if(sel>=0){
    const s=L[sel],ps=w2s(s.x,s.y);
    ctx.lineWidth=1.6;
    const drawArc=(o,col)=>{const po=w2s(o.x,o.y);const mx=(ps[0]+po[0])/2,my=(ps[1]+po[1])/2-Math.hypot(po[0]-ps[0],po[1]-ps[1])*.2;
      ctx.strokeStyle=col;ctx.globalAlpha=.75;ctx.beginPath();ctx.moveTo(ps[0],ps[1]);ctx.quadraticCurveTo(mx,my,po[0],po[1]);ctx.stroke();
      if(!reduce){const k=(tnow*.7+o.i*.37)%1;const q=1-k;const x=q*q*ps[0]+2*q*k*mx+k*k*po[0],y=q*q*ps[1]+2*q*k*my+k*k*po[1];ctx.globalAlpha=1;ctx.drawImage(spr[o.b],x-7,y-7,14,14);}};
    out[sel].forEach(i=>drawArc(L[i],'#ffd86b'));
    inn[sel].forEach(i=>drawArc(L[i],'#7be9ff'));
  }
  /* flow pulses for tour */
  if(flow){
    const pts=flow.pts;let tot=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d;}
    for(let q=0;q<4;q++){let u=((tnow*.12)+q/4)%1*tot,i=0;while(i<seg.length-1&&u>seg[i]){u-=seg[i];i++;}
      const f=u/seg[i],x=pts[i][0]+(pts[i+1][0]-pts[i][0])*f,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*f,p=w2s(x,y);
      ctx.globalAlpha=1;ctx.drawImage(spr[0],p[0]-16,p[1]-16,32,32);}
  }
  /* selected ring */
  if(sel>=0){const s=L[sel],p=w2s(s.x,s.y);const r=Math.max(s.r*cam.z,3)*2.2+6+Math.sin(tnow*5)*1.5;
    ctx.globalAlpha=.95;ctx.strokeStyle='#ffb43a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.stroke();}
  /* labels */
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.textBaseline='middle';
  if(sel>=0){
    const s=L[sel],p=w2s(s.x,s.y);label(s.nm,p[0],p[1]-20,'#ffd86b',15,700,true,true);
    const list=adj[sel].filter(i=>L[i].named).sort((a,b)=>L[b].deg-L[a].deg).slice(0,12);
    for(const i of list){const o=L[i],q=w2s(o.x,o.y);label(o.nm,q[0],q[1]-12,'#bfe9fb',12,600,true);}
  }
  if(hover>=0&&hover!==sel){const o=L[hover],q=w2s(o.x,o.y);label(o.nm,q[0],q[1]-16,'#fff',13,700,true,true);}
  /* branch and twig names */
  const fade=growing?clamp((grow-.55)/.2,0,1):1;
  if(fade>0){
    ctx.globalAlpha=fade;
    T.branches.forEach((b,bi)=>{
      if(hlBranches&&!hlBranches.has(bi))return;if(focusBr>=0&&bi!==focusBr)return;
      const q=lblPos(bi);const sz=clamp(13+cam.z*6,14,20);
      ctx.font='700 '+sz+'px "Exo 2",sans-serif';const tw=ctx.measureText(BR[bi].n).width;
      label(BR[bi].n,q.al===1?q.x:(q.al===2?q.x-tw:q.x),q.y,BR[bi].c,sz,700,q.al===1,true);
    });
    if(cam.z>.62||focusBr>=0){
      T.branches.forEach((b,bi)=>{
        if(focusBr>=0&&bi!==focusBr)return;if(hlBranches&&!hlBranches.has(bi))return;
        b.twigs.forEach(t=>{const p=w2s(t.c[0],t.c[1]-t.R-6);label(t.name,p[0],p[1],'#9fd8ee',12,600,true);});
      });
    }
    ctx.globalAlpha=1;
  }
  shown=sh;
}
let shown=[];

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;tnow+=dt;
  const k=1-Math.pow(.0009,dt);
  cam.x+=(goal.x-cam.x)*k;cam.y+=(goal.y-cam.y)*k;cam.z+=(goal.z-cam.z)*k;
  view.bottom+=(view.gb-view.bottom)*k;
  if(growing){growT+=dt;grow=Math.min(1,growT/5);if(grow>=1)growing=false;}
  draw();requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const ptrs=new Map();let moved=0,pinch0=0,z0=1;
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
function pick(px,py){
  let best=-1,bd=1e9;
  for(const [l,p,r] of shown){const dx=p[0]-px,dy=p[1]-py,d2=dx*dx+dy*dy,rr=Math.max(17,r*1.6);if(d2<rr*rr&&d2<bd){bd=d2;best=l.i;}}
  return best;
}
function pickBranchLabel(px,py){
  for(let bi=0;bi<T.branches.length;bi++){const q=lblPos(bi);ctx.font='700 16px "Exo 2",sans-serif';const w=ctx.measureText(BR[bi].n).width;
    const cx=q.al===1?q.x:(q.al===2?q.x-w/2:q.x+w/2);
    if(Math.abs(px-cx)<w/2+10&&Math.abs(py-q.y)<18)return bi;}
  return -1;
}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size===2){pinch0=pd();z0=goal.z;}});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){const r=cv.getBoundingClientRect();hover=pick(e.clientX-r.left,e.clientY-r.top);cv.style.cursor=hover>=0?'pointer':'grab';return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);goal.x-=dx/cam.z;goal.y-=dy/cam.z;cam.x=goal.x;cam.y=goal.y;}
  else if(ptrs.size===2){const z=clamp(z0*pd()/pinch0,.12,3.6);goal.z=cam.z=z;moved+=10;}
});
function up(e){
  const one=ptrs.size===1;ptrs.delete(e.pointerId);
  if(one&&moved<7){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    const i=pick(x,y);
    if(i>=0){if(inTour)endTour();selectLeaf(i);}
    else{const bi=pickBranchLabel(x,y);if(bi>=0){if(inTour)endTour();openBranch(bi);}}}
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
cv.addEventListener('pointerleave',()=>{hover=-1;});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  const wx=cam.x+(mx-ccx())/cam.z,wy=cam.y+(my-ccy())/cam.z;const z=clamp(goal.z*Math.exp(-e.deltaY*.0016),.12,3.6);
  goal.z=cam.z=z;goal.x=cam.x=wx-(mx-ccx())/z;goal.y=cam.y=wy-(my-ccy())/z;},{passive:false});

function renderStep(){
  const s=STEPS[step];
  $('tbody').innerHTML='<div class="step">Шаг '+(step+1)+' из '+STEPS.length+'</div><h3>'+esc(s.t)+'</h3>'+s.x();
  $('tprev').style.visibility=step===0?'hidden':'visible';
  $('tnext').textContent=s.last?'Исследовать самому':'Дальше';
  $('tbody').scrollTop=0;
  s.fn();setTimeout(layoutUI,0);layoutUI();
  setTimeout(()=>{layoutUI();if(inTour)s.fn();},60);
}
function startTour(){inTour=true;step=0;sel=-1;focusBr=-1;closeSheet();show('tour',true);renderStep();}
function endTour(){inTour=false;hlBranches=null;flow=null;show('tour',false);layoutUI();}
$('tnext').addEventListener('click',()=>{if(STEPS[step].last){endTour();fitAll();return;}step++;renderStep();});
$('tprev').addEventListener('click',()=>{if(step>0){step--;renderStep();}});
$('tskip').addEventListener('click',()=>{endTour();fitAll();});
$('bTour').addEventListener('click',()=>{$('mSec').classList.add('hide');$('mFind').classList.add('hide');startTour();startGrow();});

if(unlocked){openApp();}
</script>
