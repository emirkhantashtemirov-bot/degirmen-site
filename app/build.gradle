plugins { id 'com.android.application' }
android {
    namespace 'kz.degirmen.guard'
    compileSdk 34
    defaultConfig {
        applicationId 'kz.degirmen.guard'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        rel { storeFile file('guard.jks'); storePassword 'degirmenGuard'; keyAlias 'guard'; keyPassword 'degirmenGuard' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.rel }
        debug { signingConfig signingConfigs.rel }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
