<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Superhero">
<title>Superhero - качай героя</title>
<meta name="description" content="Фитнес-РПГ: записывай тренировки, качай мышцы на 3D-герое, считай калории с ИИ-тренером.">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","@supabase/supabase-js":"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"}}</script>
<style>
:root{--bg:#07080d;--c1:#10131d;--c2:#161a28;--c3:#1f2436;--ln:#262c42;--tx:#eef1ff;--mu:#8c93ad;--gold:#ffb020;--pur:#9a5cff;--blu:#3d8bff;--grn:#3ddc84;--red:#ff4d4d;--org:#ff7a2a;--r:18px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Manrope,system-ui,sans-serif;overscroll-behavior:none}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#1a1f3a 0%,#0a0c14 55%,#07080d 100%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,.hd{font-family:Unbounded,Manrope,sans-serif;letter-spacing:.2px;margin:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
a{color:var(--blu)}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 10px) 14px calc(96px + var(--sb))}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.top h1{flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--c2);display:grid;place-items:center;border:1px solid var(--ln)}
.ib svg{width:20px;height:20px}
.card{background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:10px 0}
.card h3{margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:11.5px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;background:var(--c3);border:1px solid var(--ln);font-weight:700}
.b.p{background:linear-gradient(135deg,#ffb020,#ff7a2a);color:#1a0f00;border:0;box-shadow:0 6px 24px #ff8a2a44}
.b.v{background:linear-gradient(135deg,#7a4dff,#3d8bff);border:0;color:#fff;box-shadow:0 6px 24px #6a5cff44}
.b.g{background:transparent}
.b.w{width:100%}.b.s{height:38px;padding:0 12px;border-radius:11px;font-size:14px}
.b:active{transform:scale(.97)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;background:var(--c2);border:1px solid var(--ln);font-weight:600;font-size:13px;color:var(--mu)}
.chip.on{background:var(--tx);color:#0b0d16;border-color:var(--tx)}
input.in,select.in,textarea.in{width:100%;height:48px;border-radius:13px;background:#0b0e17;border:1px solid var(--ln);padding:0 14px;outline:none}
textarea.in{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--blu)}
label.l{display:block;font-size:12.5px;color:var(--mu);margin:12px 0 6px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 10px calc(8px + var(--sb));background:linear-gradient(180deg,#07080d00,#07080dee 30%)}
.nav>div{display:flex;max-width:540px;width:100%;background:#121522f2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:22px;padding:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;color:var(--mu);font-size:10.5px;font-weight:700}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--tx);background:var(--c3)}
.nav button.w{color:#1a0f00;background:linear-gradient(135deg,#ffb020,#ff7a2a)}
.stage{position:relative;height:min(62vh,560px);margin:0 -14px;border-radius:0}
.stage canvas{display:block;width:100%!important;height:100%!important}
.ov{position:absolute;pointer-events:none;inset:0}
.ov>*{pointer-events:auto}
.lvb{position:absolute;left:14px;top:4px;display:flex;align-items:center;gap:10px}
.lvc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#2a2f45 0);position:relative}
.lvc:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#0d1019}
.lvc b{position:relative;z-index:1;font:900 20px Unbounded}
.rk{font:700 12px Unbounded;color:var(--gold);text-transform:uppercase;letter-spacing:.6px}
.modes{position:absolute;left:14px;right:14px;bottom:8px;display:flex;gap:6px;justify-content:center}
.side{position:absolute;right:14px;top:6px;display:flex;flex-direction:column;gap:8px}
.leg{position:absolute;left:14px;bottom:52px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--mu)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar{height:8px;border-radius:9px;background:#22273a;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blu),var(--pur))}
.bar.gold>i{background:linear-gradient(90deg,#ffb020,#ff7a2a)}
.bar.grn>i{background:linear-gradient(90deg,#2bbf6e,#3ddc84)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:12px}
.stat b{display:block;font:800 20px Unbounded}
.stat span{font-size:12px;color:var(--mu)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #ffffff0d}
.li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--c3);color:var(--mu)}
.sheet-bg{position:fixed;inset:0;z-index:50;background:#000a;backdrop-filter:blur(3px);opacity:0;transition:.2s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;background:#10131d;border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + var(--sb));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#333a55;margin:2px auto 12px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);z-index:80;background:#1d2236;border:1px solid var(--ln);padding:11px 16px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px #0008;max-width:90vw}
.toast.e{border-color:#ff4d4d88}
/* тренировка */
.exc{background:var(--c1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin:10px 0}
.exc .hd2{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.exc .hd2 b{flex:1;font-size:15.5px}
.setr{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;margin:6px 0}
.setr .n{font:800 13px Unbounded;color:var(--mu);text-align:center}
.setr .n.wu{color:var(--blu);font-size:10px}
.num{display:flex;align-items:center;background:#0b0e17;border:1px solid var(--ln);border-radius:12px;height:46px}
.num button{width:34px;height:100%;color:var(--mu);font-size:20px;font-weight:700}
.num input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:0;outline:none;font:800 17px Manrope}
.ok{height:46px;border-radius:12px;background:var(--c3);border:1px solid var(--ln);display:grid;place-items:center}
.ok.on{background:linear-gradient(135deg,#2bbf6e,#3ddc84);border:0;color:#04180c}
.setr.done .num{border-color:#2bbf6e66;background:#0c1a14}
.hint{font-size:12.5px;padding:8px 10px;border-radius:11px;background:#3d8bff14;border:1px solid #3d8bff33;color:#a9c8ff;margin:6px 0}
.hint.up{background:#3ddc8414;border-color:#3ddc8440;color:#9ff0c4}
.hint.dn{background:#ffb02014;border-color:#ffb02040;color:#ffd58a}
.rest{position:fixed;left:0;right:0;top:0;z-index:40;padding:calc(var(--st) + 8px) 14px 10px;background:#0b0e17f0;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px}
.rest b{font:900 26px Unbounded;min-width:86px}
.rest .bar{flex:1}
/* питание */
.rings{display:flex;gap:12px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{display:block;font:900 22px Unbounded}
.macro{flex:1;display:flex;flex-direction:column;gap:9px}
.macro .row span{font-size:12.5px}
.meal{margin:12px 0 4px;display:flex;align-items:center}
.meal h3{flex:1}
.fi{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #ffffff0d}
.fi .k{font-weight:800}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.45}
.msg.u{align-self:flex-end;background:#3d8bff;color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--c2);border:1px solid var(--ln);border-bottom-left-radius:5px}
.quest{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #ffffff0d}
.quest:first-of-type{border-top:0}
.qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c3);font-size:20px;flex:none}
.res-m{display:flex;align-items:center;gap:10px;padding:8px 0}
.lvup{font:900 12px Unbounded;color:var(--gold)}
.big{font:900 40px Unbounded;background:linear-gradient(135deg,#ffd06a,#ff7a2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hide{display:none!important}
.auth{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
.logo{font:900 34px Unbounded;letter-spacing:-.5px;background:linear-gradient(135deg,#fff,#a9b7ff 50%,#9a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tgb{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;background:#2aabee;color:#fff;font-weight:800;text-decoration:none}
.step{display:flex;gap:6px;margin:6px 0 16px}.step i{flex:1;height:4px;border-radius:4px;background:#262c42}.step i.on{background:var(--gold)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:15px;background:var(--c2);border:1px solid var(--ln);margin:8px 0;text-align:left}
.opt.on{border-color:var(--gold);background:#ffb02012}
.opt .e{font-size:22px}
.svgc{width:100%;height:auto;display:block}
.loader{display:grid;place-items:center;min-height:70vh;color:var(--mu)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #2a3048;border-top-color:var(--gold);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.off{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sb));z-index:35;background:#2a1d08;border:1px solid #ffb02055;color:#ffd58a;padding:7px 12px;border-radius:12px;font-size:12.5px;font-weight:700}

/* ---------- плавность в стиле iOS ---------- */
:root{--spring:cubic-bezier(.32,.72,0,1);--ease:cubic-bezier(.2,.8,.2,1)}
.b,.chip,.ib,.opt,.ok,.li,.stat,.nav button{transition:transform .22s var(--ease),background-color .25s,color .25s,border-color .25s,box-shadow .25s,opacity .2s}
.b:active,.chip:active,.ib:active,.opt:active,.stat:active,.ok:active{transform:scale(.95)}
.li:active{transform:scale(.985);opacity:.8}
.sheet{transition:transform .5s var(--spring)}
.sheet.drag{transition:none}
.sheet-bg{transition:opacity .35s ease}
@keyframes inR{from{opacity:0;transform:translate3d(22px,0,0)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate3d(-22px,0,0)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate3d(0,14px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ringIn{from{stroke-dasharray:0 1000}}
@keyframes fadeIn{from{opacity:0}}
@keyframes check{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes flashG{0%{box-shadow:0 0 0 0 #3ddc8488}100%{box-shadow:0 0 0 14px #3ddc8400}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-30px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glowPulse{0%,100%{box-shadow:0 6px 24px #ff8a2a44}50%{box-shadow:0 6px 34px #ff8a2a88}}
.enter-r>*{animation:inR .42s var(--ease) both}
.enter-l>*{animation:inL .42s var(--ease) both}
.enter-r>*:nth-child(2),.enter-l>*:nth-child(2){animation-delay:.03s}
.enter-r>*:nth-child(3),.enter-l>*:nth-child(3){animation-delay:.06s}
.enter-r>*:nth-child(4),.enter-l>*:nth-child(4){animation-delay:.09s}
.enter-r>*:nth-child(5),.enter-l>*:nth-child(5){animation-delay:.12s}
.enter-r>*:nth-child(6),.enter-l>*:nth-child(6){animation-delay:.15s}
.enter-r>*:nth-child(n+7),.enter-l>*:nth-child(n+7){animation-delay:.18s}
.enter-r .bar>i,.enter-l .bar>i,.sheet .bar>i{transform-origin:left;animation:grow .9s var(--ease) .15s both}
.enter-r .ring circle+circle,.enter-l .ring circle+circle{animation:ringIn 1.1s var(--ease) .1s both}
.sheet>*{animation:up .45s var(--ease) both}
.sheet>*:nth-child(3){animation-delay:.03s}.sheet>*:nth-child(4){animation-delay:.06s}.sheet>*:nth-child(5){animation-delay:.09s}.sheet>*:nth-child(n+6){animation-delay:.12s}
.toast{animation:toastIn .45s var(--spring) both}
.setr.just .ok{animation:check .45s var(--spring)}
.setr.just .num{animation:flashG .7s ease-out}
.b.p{animation:glowPulse 3s ease-in-out infinite}
.nav>div{position:relative}
.nav .pill{position:absolute;top:6px;bottom:6px;left:6px;border-radius:16px;background:var(--c3);transition:transform .5s var(--spring),width .5s var(--spring),background .3s;z-index:0}
.nav .pill.w{background:linear-gradient(135deg,#ffb020,#ff7a2a)}
.nav button{position:relative;z-index:1;background:none!important}
.nav button.w{color:#1a0f00}
.nav button.on svg{transform:translateY(-1px) scale(1.08);transition:transform .35s var(--spring)}
.ov .lvb,.ov .side,.ov .modes,.ov .leg{animation:fadeIn .8s ease .4s both}
.skel{background:linear-gradient(90deg,#161a28 25%,#20263a 50%,#161a28 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:12px}
.chip{transition:background-color .3s,color .3s,border-color .3s,transform .2s var(--ease)}
.sug{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:7px;margin-left:6px;vertical-align:1px}
.sug.mu2{background:#3ddc8420;color:#7fe8ad}.sug.bl{background:#ff4d4d20;color:#ff9a9a}.sug.md{background:#ffb02020;color:#ffd06a}.sug.sl{background:#3d8bff20;color:#9cc2ff}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.wbar{position:fixed;left:0;right:0;bottom:calc(78px + var(--sb));z-index:29;max-width:560px;margin:0 auto;padding:8px 12px;background:linear-gradient(180deg,#07080d00,#07080dee 35%)}
.wbar .in{height:50px;border-radius:16px;background:#121624;border-color:#3d8bff55;box-shadow:0 6px 24px #0008}
#app:has(.wbar){padding-bottom:calc(170px + var(--sb))}
.b svg,.chip svg{width:20px;height:20px;flex:none}
</style>
</head>
<body>
<div id="app"><div class="loader"><div class="spin"></div></div></div>
<nav class="nav hide" id="nav"></nav>
<script type="module" src="app.js?v=7"></script>
</body>
</html>
